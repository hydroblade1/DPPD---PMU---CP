<!DOCTYPE html>
<html lang="si" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පහන් පාලක පුවරුව - Controller Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Serif+Sinhala:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #260A0F 0%, #120306 60%, #050002 100%);
            font-family: 'Noto Serif Sinhala', serif;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(35, 8, 14, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        @keyframes touchRipple {
            0% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.7), 0 0 30px rgba(255, 160, 0, 0.5); }
            70% { box-shadow: 0 0 0 35px rgba(255, 193, 7, 0), 0 0 50px rgba(255, 160, 0, 0.8); }
            100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0), 0 0 30px rgba(255, 160, 0, 0.5); }
        }
        .touch-button-glow { animation: touchRipple 2.2s infinite; }
        .touch-button-active {
            transform: scale(0.93) !important;
            background: radial-gradient(circle, #ffe082 0%, #ffb300 60%, #e65100 100%) !important;
            box-shadow: 0 0 60px #ffb300, inset 0 0 25px #ffffff !important;
        }
    </style>
</head>
<body class="min-h-screen text-amber-100 flex flex-col justify-between items-center p-4 select-none">

    <nav class="w-full max-w-md py-3 px-4 glass-card border border-amber-500/20 rounded-xl flex items-center justify-between text-sm mb-4">
        <span class="font-bold text-amber-300 font-cinzel tracking-wider uppercase">Prince Media Unit</span>
        <button id="audioToggleBtn" class="p-2 rounded-lg bg-amber-950/80 text-amber-300 border border-amber-500/30">🔊</button>
    </nav>

    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center my-auto">
        <div class="glass-card p-8 sm:p-12 rounded-3xl w-full flex flex-col items-center text-center shadow-2xl relative border border-amber-500/40">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-amber-300 mb-1">පහන දැල්වීම සඳහා</h2>
            <p class="text-amber-100/70 text-xs sm:text-sm mb-10">පහත බොත්තම තට්ටු කරන්න (Touch)</p>

            <div class="relative flex items-center justify-center my-6">
                <div class="absolute w-52 h-52 sm:w-64 sm:h-64 rounded-full border-2 border-amber-400/50 touch-button-glow pointer-events-none"></div>
                <button id="touchBtn" class="relative z-10 w-44 h-44 sm:w-56 sm:h-56 rounded-full bg-gradient-to-b from-amber-300 via-amber-500 to-amber-700 text-amber-950 font-extrabold shadow-2xl flex flex-col items-center justify-center border-4 border-amber-200 transition-all duration-150 cursor-pointer outline-none">
                    <span class="text-3xl sm:text-4xl font-black font-cinzel tracking-wider">TOUCH</span>
                    <span class="text-xs sm:text-sm font-bold tracking-widest text-amber-900 mt-1">අත තබන්න</span>
                </button>
            </div>

            <div class="mt-8 text-base font-bold text-amber-200">
                දල්වන ලද පහන්: <span id="controllerLitCount" class="text-amber-400 text-2xl font-cinzel">0</span> / 17
            </div>
            <div id="controllerStatusMsg" class="mt-2 text-xs text-amber-300/80">Firebase හරහා සම්බන්ධ වී ඇත</div>
        </div>
    </main>

    <footer class="py-2 text-center text-xs text-amber-300/50">
        Website made by <span style="color: #00ffcc;">Gesadu Sadith</span>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBBUSCofeLIbF7YwqIfGijyQq0wtC-8Y0k",
            authDomain: "dppd---pmu.firebaseapp.com",
            databaseURL: "https://dppd---pmu-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "dppd---pmu",
            storageBucket: "dppd---pmu.firebasestorage.app",
            messagingSenderId: "192997484899",
            appId: "1:192997484899:web:e736056e353499ebb88b56"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentLitCount = 0;
        const totalLamps = 17;
        let isAudioMuted = false;

        const touchBtn = document.getElementById('touchBtn');
        const controllerLitCount = document.getElementById('controllerLitCount');
        const controllerStatusMsg = document.getElementById('controllerStatusMsg');
        const audioToggleBtn = document.getElementById('audioToggleBtn');

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const chimeNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00, 2349.32];

        function playChimeSound(step) {
            if (isAudioMuted) return;
            try {
                initAudio();
                const freq = chimeNotes[step - 1] || 440;
                const masterGain = audioCtx.createGain();
                masterGain.connect(audioCtx.destination);
                masterGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                masterGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.8);

                const osc1 = audioCtx.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc1.connect(masterGain);
                osc1.start();
                osc1.stop(audioCtx.currentTime + 2.8);
            } catch (e) {}
        }

        // Firebase එකෙන් කවුන්ට් එක වෙනස් වන විට ටැබ් එකත් අಪ್ഡේට් වීම
        db.ref('pahanCount').on('value', (snapshot) => {
            currentLitCount = snapshot.val() || 0;
            controllerLitCount.textContent = currentLitCount;
            if (currentLitCount >= totalLamps) {
                controllerStatusMsg.textContent = 'සියලු පහන් දල්වා අවසන්!';
            } else if (currentLitCount > 0) {
                controllerStatusMsg.textContent = `${currentLitCount} / 17 පහන් දල්වා ඇත`;
            } else {
                controllerStatusMsg.textContent = 'Firebase හරහා සම්බන්ධ වී ඇත';
            }
        });

        function triggerLight() {
            if (currentLitCount >= totalLamps) return;
            let newCount = currentLitCount + 1;
            
            // Firebase Database එකට අලුත් කවුන්ට් එක යැවීම (එතකොට ස්මාර්ට් බෝඩ් එක ස්වයංක්‍රීයව ඔන් වෙනවා)
            db.ref('pahanCount').set(newCount);
            playChimeSound(newCount);
        }

        touchBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            touchBtn.classList.add('touch-button-active');
            triggerLight();
        });
        touchBtn.addEventListener('pointerup', () => touchBtn.classList.remove('touch-button-active'));
        touchBtn.addEventListener('pointerleave', () => touchBtn.classList.remove('touch-button-active'));

        audioToggleBtn.addEventListener('click', () => {
            isAudioMuted = !isAudioMuted;
            audioToggleBtn.textContent = isAudioMuted ? '🔇' : '🔊';
        });
    </script>
</body>
</html>
